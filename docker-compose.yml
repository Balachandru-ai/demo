backend:
  build:
    context: .
    dockerfile: Dockerfile.backend

  container_name: backend
  restart: unless-stopped

  ports:
    - "5000:5000"

  environment:
    NODE_ENV: production
    PORT: 5000
    MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/fullstack-app?authSource=admin

  depends_on:
    mongodb:
      condition: service_healthy

  networks:
    - app-network

  volumes:
    - backend_logs:/app/logs

  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://127.0.0.1:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s
